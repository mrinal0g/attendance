{% extends "base.html" %} {% block title %}Attendance Portal{% endblock %} 
{% block content %}
<section class="hero">
  <p class="eyebrow">Student attendance</p>
  <h1>Record attendance simply.</h1>
  <p>Register once, then login with your username to record your attendance.</p>
  <div class="actions">
    <a class="button" href="{% url 'register' %}">Register</a>
    <a class="button secondary" href="{% url 'login' %}"

    >
  </div>
</section>
{% endblock %}
