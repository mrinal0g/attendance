{% extends "base.html" %}

{% block title %}Find student | Attendance Portal{% endblock %}

{% block content %}
  <section class="card">
    <h1>Mark attendance</h1>
    <p class="subtle">Enter the username used during registration.</p>
    <form method="post">
      {% csrf_token %}
      <p>
        <label for="username">Username</label>
        <input id="username" name="username" value="{{ username|default:'' }}" required autofocus>
      </p>
      {% if error %}<p class="error">{{ error }}</p>{% endif %}
      <button type="submit">Find student</button>
    </form>
  </section>
{% endblock %}
